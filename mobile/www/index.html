<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great Rift Harvests</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8f3; --card: #fff; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1; --green: #20593b; --err: #c03c5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --card: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --green: #388b5c; --err: #e48595; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { border-radius: 22px; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 26px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; text-align: left; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; background: transparent; color: var(--fg); }
  input:focus { outline: 2px solid var(--green); border-color: transparent; }
  small { display: block; color: var(--muted); margin-top: 8px; font-size: 13px; }
  .error { color: var(--err); font-size: 14px; margin-top: 8px; min-height: 1em; }
  button { width: 100%; margin-top: 16px; background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 13px; font: 600 16px system-ui, sans-serif; }
  .saved { margin-bottom: 16px; }
  .link { background: none; color: var(--green); margin-top: 8px; padding: 6px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" width="80" height="80" alt="">
  <h1>Great Rift Harvests</h1>
  <p id="intro">Enter the address of your store to get started.</p>
  <form id="form" novalidate>
    <label for="url">Store address</label>
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://greatriftharvests.co.ke">
    <small>Testing on your computer? Use its Wi-Fi address, for example <b>http://192.168.1.20:3000</b>, with the phone on the same Wi-Fi.</small>
    <div class="error" id="error" role="alert"></div>
    <button type="submit">Open store</button>
  </form>
</main>
<script src="app-config.js"></script>
<script>
  // Setup screen, shown only in builds made without APP_URL.
  var KEY = "grh-store-url";
  var input = document.getElementById("url");
  var error = document.getElementById("error");
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var changing = location.search.indexOf("change=1") !== -1;

  function normalise(value) {
    value = value.trim().replace(/\/+$/, "");
    if (!value) return null;
    if (!/^https?:\/\//i.test(value)) value = (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?$/.test(value) || /^localhost/.test(value) ? "http://" : "https://") + value;
    try { var u = new URL(value); return u.origin; } catch (e) { return null; }
  }

  function open(url) {
    try { localStorage.setItem(KEY, url); } catch (e) {}
    location.href = url + "/";
  }

  if (window.GRH_APP_URL) {
    location.replace(window.GRH_APP_URL + "/");
  } else if (saved && !changing) {
    open(saved);
  } else if (saved) {
    input.value = saved;
    document.getElementById("intro").textContent = "Change the store address the app opens.";
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var url = normalise(input.value);
    if (!url) { error.textContent = "Please enter a valid address."; return; }
    error.textContent = "";
    open(url);
  });
</script>
</body>
</html>
