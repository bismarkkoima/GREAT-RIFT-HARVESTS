<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can't connect · Great Rift Harvests</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8f3; --fg: #1c1917; --muted: #78716c; --green: #20593b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --green: #388b5c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  img { border-radius: 18px; }
  h1 { font-family: Georgia, serif; font-weight: 600; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; max-width: 320px; }
  button { display: block; width: 240px; margin: 0 auto 10px; border-radius: 999px; padding: 12px; font: 600 15px system-ui, sans-serif; border: 0; background: var(--green); color: #fff; }
  button.secondary { background: none; color: var(--green); }
</style>
</head>
<body>
<main>
  <img src="icon.png" width="64" height="64" alt="">
  <h1>Can't reach the store</h1>
  <p>Check your internet connection and try again.</p>
  <button onclick="retry()">Try again</button>
  <button class="secondary" id="change" hidden onclick="location.href='index.html?change=1'">Change store address</button>
</main>
<script src="app-config.js"></script>
<script>
  var saved = null;
  try { saved = localStorage.getItem("grh-store-url"); } catch (e) {}
  // Only builds with the setup screen have a saved address to change.
  if (saved && !window.GRH_APP_URL) document.getElementById("change").hidden = false;
  var target = window.GRH_APP_URL || saved;
  function retry() { if (target) location.href = target + "/"; else location.href = "index.html"; }
</script>
</body>
</html>
