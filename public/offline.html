<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Great Rift Harvests</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8f3; --fg: #1c1917; --muted: #78716c; --green: #20593b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --green: #388b5c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-family: Georgia, serif; font-weight: 600; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font: 600 15px system-ui, sans-serif; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="72" height="72" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
